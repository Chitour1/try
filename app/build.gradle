plugins { id 'com.android.application' }
android {
    namespace 'com.independent.akwam.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.independent.akwam.tv'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
