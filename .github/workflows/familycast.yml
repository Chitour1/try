name: FamilyCast APK
on:
  push:
    branches: [family-cast]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk FamilyCast.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyCast
          path: FamilyCast.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: familycast-v${{ github.run_number }}
          name: عرض عائلي ${{ github.run_number }}
          target_commitish: family-cast
          files: FamilyCast.apk
