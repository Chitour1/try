name: Build Akwam Phone 2.3.1 APK
on:
  push:
    branches: [akwam-phone-v23-clean]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone pinned browser engine
        run: |
          git clone https://github.com/m-salehi-v/mrowser.git engine
          cd engine
          git checkout dcfdcb666cc4a743437093544f63c34e72f98c1a
      - name: Restore v2.3 and remove overlays for phone
        run: python3 phone-version/restore_2_3.py engine
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build phone APK
        working-directory: engine
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Akwam-Phone-v2.3.1-APK
          path: engine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
