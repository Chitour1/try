name: Build Akwam TV New Engine
on:
  push:
    branches:
      - akwam-tv-engine-v2
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone TV browser engine
        run: |
          git clone https://github.com/m-salehi-v/mrowser.git engine
          cd engine
          git checkout dcfdcb666cc4a743437093544f63c34e72f98c1a
      - name: Customize engine and suppress advertising popups
        run: python3 patches/customize_akwam.py engine
      - name: Install Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build installable APK
        working-directory: engine
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AkwamTV-v2.1-PopupFix-APK
          path: engine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
