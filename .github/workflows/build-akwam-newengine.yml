name: Build Akwam TV New Engine
on:
  push:
    branches:
      - akwam-tv-engine-v2
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone TV browser engine
        run: |
          git clone https://github.com/m-salehi-v/mrowser.git engine
          cd engine
          git checkout dcfdcb666cc4a743437093544f63c34e72f98c1a
      - name: Customize the engine for Akwam
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("engine")
          f = base / "app/src/main/kotlin/net/mrowser/data/DefaultFavorites.kt"
          s = f.read_text()
          s = s.replace('Favorite("YouTube", "https://www.youtube.com/tv"),\n        Favorite("Google", "https://www.google.com")',
                        'Favorite("أكوام الجديد", "https://akwam.ss/"),\n        Favorite("أكوام القديم", "https://old.akwam.ss/")')
          assert 'أكوام الجديد' in s and 'أكوام القديم' in s
          f.write_text(s)
          strings = base / "app/src/main/res/values/strings.xml"
          s = strings.read_text()
          s = s.replace('<string name="app_name">mrowser</string>',
                        '<string name="app_name">بوابة أكوام TV</string>')
          s = s.replace('<string name="url_hint">Enter address</string>',
                        '<string name="url_hint">اختر أكوام الجديد أو القديم أدناه</string>')
          assert '<string name="app_name">بوابة أكوام TV</string>' in s
          strings.write_text(s)
          gradle = base / "app/build.gradle.kts"
          s = gradle.read_text()
          s = s.replace('applicationId = "net.mrowser"',
                        'applicationId = "com.independent.akwam.tvengine"')
          s = s.replace('versionCode = 9', 'versionCode = 104')
          s = s.replace('versionName = "1.4.0"', 'versionName = "2.0.0"')
          gradle.write_text(s)
          assets=base / "app/src/main/assets"
          assets.mkdir(parents=True,exist_ok=True)
          (assets/"THIRD_PARTY_LICENSE_MROWSER.txt").write_text((base/"LICENSE").read_text())
          print("Akwam browser customizations applied.")
          PY
      - name: Install Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build installable APK
        working-directory: engine
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AkwamTV-NewEngine-APK
          path: engine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
