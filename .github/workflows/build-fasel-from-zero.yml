name: Build Fasel TV from scratch
on:
  push:
    branches:
      - fasel-tv-from-zero-20261113
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build
        working-directory: fasel-tv
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaselTV-From-Scratch-APK
          path: fasel-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
